apiVersion: apps/v1
kind: Deployment
metadata:
  name: networx-media-deployment
  labels:
    app: networx-media
spec:
  replicas: 3
  selector:
    matchLabels:
      app: networx-media
  template:
    metadata:
      labels:
        app: networx-media
    spec:
      # Add the hostAliases here
      hostAliases:
      - ip: "172.20.10.236"
        hostnames:
        - "mariadb.networx.com"
      - ip: "172.20.10.237"
        hostnames:
        - "mongodb.networx.com"
      containers:
      - name: networx-media
        image: mediaserver:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "256Mi"
            cpu: "200m"
          requests:
            memory: "128Mi"
            cpu: "100m"
        volumeMounts:
        - name: media-storage
          mountPath: /data/media # Path inside the container
      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: networx-media-pvc